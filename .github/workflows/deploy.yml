# Publishes the portal to GitHub Pages on every push to main,
# filling in the Supabase publishable key from the repo secret.
name: Deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Insert Supabase publishable key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repo secret SUPABASE_PUBLISHABLE_KEY is not set; the live site was left unchanged."
            exit 1
          fi
          # Never publish a secret key into the public page
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY holds a secret key; use the publishable (anon) key."; exit 1 ;;
          esac
          if echo "$SUPABASE_PUBLISHABLE_KEY" | cut -d. -f2 | base64 -d 2>/dev/null | grep -q '"service_role"'; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY holds the service_role key; use the publishable (anon) key."
            exit 1
          fi
          mkdir -p _site
          cp index.html video-proof.js _site/
          sed -i "s|PASTE_PUBLISHABLE_KEY_HERE|${SUPABASE_PUBLISHABLE_KEY}|" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
